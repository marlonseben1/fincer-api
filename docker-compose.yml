services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fincer
      POSTGRES_PASSWORD: fincer
      POSTGRES_DB: fincer
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
